version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: ["type: qualité"]
    ignore:
      # Les types doivent décrire la version de Node réellement utilisée (.nvmrc : 24).
      # On ne monte de majeure qu'en changeant de version de Node, volontairement.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Next et React évoluent ensemble : une seule PR pour les deux (groupe évalué en premier).
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      # Le reste des mises à jour mineures et correctives arrive en une seule PR.
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: ["type: ci/cd"]
